name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder env keeps build analysis runnable on PRs without exposing secrets.
      NEXT_PUBLIC_APP_URL: https://www.mylivingpage.com
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SECRET_KEY: ci-placeholder-service-role-key
      # Non-secret placeholder used only by credential-free build and unit checks.
      SECURITY_HASH_PEPPER: ci-placeholder-development-only-security-hash-pepper
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_STARTER_MONTHLY_PRICE_ID: price_starter_ci_placeholder
      STRIPE_PRO_MONTHLY_PRICE_ID: price_pro_ci_placeholder
      ADMIN_EMAIL: admin@example.com
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Client security boundary
        run: npm run check:client-security

      - name: Signal Frame design boundary
        run: npm run check:signal-frame

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install browser for credential-free visual checks
        run: npx playwright install --with-deps chromium

      - name: Theme, editor, dashboard, and homepage visual regression
        env:
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start
        run: npm run test:e2e:visual

      - name: Upload visual-check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Production dependency audit
        # Fail releases on high/critical findings. The current Next.js 15 line
        # still bundles a moderate PostCSS advisory with no safe in-line fix.
        run: npm audit --omit=dev --audit-level=high

  database-schema:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.STAGING_SCHEMA_CHECK_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Explain unavailable database gate
        if: env.DATABASE_URL == ''
        run: echo "::warning::Database gates skipped. Set STAGING_SCHEMA_CHECK_DATABASE_URL to a GitHub-runner-reachable staging database."

      - name: Install dependencies
        if: env.DATABASE_URL != ''
        run: npm ci

      - name: Verify single-page schema
        if: env.DATABASE_URL != ''
        run: npm run check:single-page-schema

      - name: Verify analytics schema
        if: env.DATABASE_URL != ''
        run: npm run check:analytics-schema

      - name: Verify database security boundary
        if: env.DATABASE_URL != ''
        run: npm run check:database-security

  integration:
    runs-on: ubuntu-latest
    needs:
      - quality
      - database-schema
    timeout-minutes: 30
    env:
      # Integration and Playwright must target the isolated staging stack, never production.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SECURITY_HASH_PEPPER: ${{ secrets.STAGING_SECURITY_HASH_PEPPER }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STAGING_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
      STRIPE_STARTER_MONTHLY_PRICE_ID: ${{ secrets.STAGING_STRIPE_STARTER_MONTHLY_PRICE_ID }}
      STRIPE_PRO_MONTHLY_PRICE_ID: ${{ secrets.STAGING_STRIPE_PRO_MONTHLY_PRICE_ID }}
      NEXT_PUBLIC_LEGAL_COMPANY_NAME: ${{ secrets.NEXT_PUBLIC_LEGAL_COMPANY_NAME }}
      NEXT_PUBLIC_LEGAL_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_LEGAL_CONTACT_EMAIL }}
      NEXT_PUBLIC_LEGAL_MAILING_ADDRESS: ${{ secrets.NEXT_PUBLIC_LEGAL_MAILING_ADDRESS }}
      NEXT_PUBLIC_DMCA_AGENT_NAME: ${{ secrets.NEXT_PUBLIC_DMCA_AGENT_NAME }}
      NEXT_PUBLIC_DMCA_AGENT_EMAIL: ${{ secrets.NEXT_PUBLIC_DMCA_AGENT_EMAIL }}
      NEXT_PUBLIC_DMCA_AGENT_ADDRESS: ${{ secrets.NEXT_PUBLIC_DMCA_AGENT_ADDRESS }}
      NEXT_PUBLIC_DMCA_AGENT_PHONE: ${{ secrets.NEXT_PUBLIC_DMCA_AGENT_PHONE }}
      NEXT_PUBLIC_SECURITY_EMAIL: ${{ secrets.NEXT_PUBLIC_SECURITY_EMAIL }}
      PLAYWRIGHT_TEST_EMAIL: ${{ secrets.STAGING_PLAYWRIGHT_TEST_EMAIL }}
      PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.STAGING_PLAYWRIGHT_TEST_PASSWORD }}
      PLAYWRIGHT_SIGNUP_EMAIL_DOMAIN: ${{ secrets.STAGING_PLAYWRIGHT_SIGNUP_EMAIL_DOMAIN }}
      PLAYWRIGHT_EXPECT_SIGNUP_CONFIRMATION: ${{ secrets.STAGING_PLAYWRIGHT_EXPECT_SIGNUP_CONFIRMATION }}
      PLAYWRIGHT_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      PLAYWRIGHT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
      PLAYWRIGHT_STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
      PLAYWRIGHT_GOOGLE_EMAIL: ${{ secrets.STAGING_PLAYWRIGHT_GOOGLE_EMAIL }}
      PLAYWRIGHT_GOOGLE_PASSWORD: ${{ secrets.STAGING_PLAYWRIGHT_GOOGLE_PASSWORD }}
      ENABLE_E2E_FAILURE_INJECTION: "1"
      CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Determine integration readiness
        id: readiness
        run: |
          missing=0
          for key in \
            NEXT_PUBLIC_SUPABASE_URL \
            SUPABASE_SECRET_KEY \
            SECURITY_HASH_PEPPER \
            PLAYWRIGHT_TEST_EMAIL \
            PLAYWRIGHT_TEST_PASSWORD
          do
            if [ -z "${!key}" ]; then
              echo "Missing $key"
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip integration checks when secrets are unavailable
        if: steps.readiness.outputs.ready != 'true'
        run: echo "::warning::Integration checks skipped. Configure the staging Supabase and Playwright credentials to enable the browser release gate."

      - name: Install dependencies
        if: steps.readiness.outputs.ready == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.readiness.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke suite
        if: steps.readiness.outputs.ready == 'true'
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: always() && steps.readiness.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
